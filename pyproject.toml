[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abzctl"
version = "0.1.0"
description = "SSH orqali Docker Compose loyihalarini Caddy + avtomatik SSL bilan serverga deploy qiluvchi CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "paramiko>=3.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
abzctl = "abzctl.main:app"

[tool.setuptools.packages.find]
include = ["abzctl*"]
